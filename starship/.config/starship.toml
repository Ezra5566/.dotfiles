"$schema" = 'https://starship.rs/config-schema.json' # editor autocomplete
# NOTE: Unlike the Warp config, the right_format module was not used to
# produce the right prompt. This is because that module places elements
# on the same line as the input location. So fill is used instead.
# This has been avoided by Warp's default behaviour of creating a new line.

# === Prompt-wide configurations ===

 palette = 'catppuccin_frappe'  # gruvpunk'cyberpunk'/'catppuccin_latte'/'catppuccin_mocha'/'catppuccin_frappe'/'catppuccin_macchiato'

command_timeout = 1500       # Default timeout for commands is 500ms

add_newline = true           # A blank line before prompt start


format = """

$custom\

$username\

$sudo\

$hostname\

$localip\

$directory\

$fill\

$all$cmd_duration\

$line_break\

$battery\

$character

"""

# $git_branch\ ,git_state\ ,git_status\



# === Misc. ===

[fill]

symbol = " "




[character]

#success_symbol = "[󰅂](bold green)"
#error_symbol = "[󰩈 ](bold red)"
#vimcmd_symbol = "[](bold green)"
#vimcmd_replace_one_symbol = "[ ](bold purple)"
#vimcmd_replace_symbol = "[ ](bold purple)"
#vimcmd_visual_symbol = "[ ](bold yellow)"
error_symbol = "[󰩈 ](bold red)" #" [](bold red)"
success_symbol = " [╰─󰀵 ](bold green)"


# === 1st Line: left hand side ===

[username]

disabled = false
format = " [╭─  $user]($style) "
show_always = true 
style_user = "bold green"

# format = "[ $user]($style) "




[sudo]
disabled = false
style = "bold rosewater"
# symbol = '\[sudo\] '
symbol = " 󰌾 " # " " 
format = "[$symbol]($style)"




[hostname]

ssh_only = true
ssh_symbol = " "
# ssh_symbol = "󰣀 "
format = "[$ssh_symbol$hostname ]($style)"




[localip]

disabled = false

# only shown with SSH




[directory]

truncation_symbol = "   " #"…/      
home_symbol = " ~ " #" ~ "  
truncate_to_repo = true
truncation_length = 2
style = "bold purple"




[directory.substitutions]

"~/others" = "  "
"~/projects/" = "  "
"~/wrk/" = "  "
"~/.dotfiles/" = " "




[battery]

disabled = false
full_symbol = "󱟢 "  # "🔋 "
charging_symbol = "⚡"
discharging_symbol = " 󱟤 "

[[battery.display]]

threshold = 50
style = "bold green"




# === 1st Line: right hand side ===

[cmd_duration]

# min_time = 0
format = "[  $duration]($style)"
show_milliseconds = false
style = "flamingo"



[memory_usage]

disabled = true
threshold = 30  ## if memory usage is over 30%, show memory usage
# format = 'via $symbol [$ram_pct, $ram \($swap_pct, $swap\) ]($style)'
format = '$symbol [$ram_pct \($ram\) ]($style)'
symbol = "󰍛" # " "  # "🧠"
style = "bold dimmed green"
# style = "bold gray"



[direnv]

disabled = true



[aws]
symbol = " "

[conda]
symbol = " "

[dart]
symbol = " "

[docker_context]
symbol = " "

[elixir]
symbol = " "

[elm]
symbol = " "


[golang]
symbol = " "

[hg_branch]
symbol = " "

[java]
symbol = " "

[julia]
symbol = " "

[nim]
symbol = " "

[nix_shell]
symbol = " "

[nodejs]
detect_extensions = ["js", "mjs", "cjs", "ts"]
symbol = " 󰎙"
format = "[$symbol]($style)"
disabled = false

[package]
symbol = "  "
[perl]
symbol = " "

[php]
symbol = " "

#[python]
#symbol = " "
#format = "[$symbol]($style)"
 # Ensure $python is included in your global format string if you have a custom one
# format = """ ... $python ... """

[python]
disabled = false
format = 'via [${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'
style = "bold yellow"
symbol = "🐍 "

 # Ensure $python is included in your global format string if you have a custom one
# format = """ ... $python ... """
[ruby]
symbol = " "

[rust]
symbol = " "



# NOTE: always place this to prevent container tag

[container]
disabled = true
symbol =" " # ""
[haskell]
symbol = " "
format = "[$symbol($version )]($style)"
[jobs]
symbol = ""
# symbol = ""
# symbol = ""
# symbol = ""
# symbol = "✦"
[swift]
symbol = " "
format = "[$symbol($version )]($style)"
[terraform]
symbol = " "
format = "[$symbol$workspace]($style) "




#testing if git lastwill work note: I donooo

[git_branch]

symbol = "  "
format = '[on](text dimmed) [$symbol$branch(:$remote_branch)]($style) '
style = "bold green"




[git_commit]

format = '[on](text dimmed) [ $hash$tag]($style) '
style = "bold green"
tag_disabled = false
tag_symbol = "  "

[git_state]

rebase = "REBASING"
merge = "MERGING"
cherry_pick = "🍒 PICKING"
style = "bold yellow"


[git_status]

style = "bold red"
format = '[$all_status$ahead_behind]($style)'
renamed = "󰆾 "
conflicted = "󰞇 "
up_to_date = " "
# untracked = " "
# untracked = " "
untracked = "󱄁 "
modified = " "
deleted = " "
stashed = "󰏗 "
staged = '[++$count](green) '
diverged = "⇕⇡($ahead_count)⇣($behind_count) "
ahead = "⇡$count "
behind = "⇣$count "











